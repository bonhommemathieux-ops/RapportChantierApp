<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f97316">
  <title>Chantier FCTP</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<header>
  <img src="logo.png" alt="FCTP" class="logo-fctp">
  <div>
    <h1>Chantier FCTP</h1>
    <div class="subtitle">Rapport & avancement</div>
  </div>
</header>

<main>
  <form id="form">

    <section class="section">
      <h2>Informations générales</h2>
      <div class="grid">
        <div>
          <label for="date">Date</label>
          <input type="date" id="date" lang="fr-FR" required>
          <div class="date-fr" id="dateFr"></div>
        </div>
        <div>
          <label for="chantier">Nom du chantier</label>
          <input type="text" id="chantier" placeholder="Ex : MATABIAU Secteur 3" required>
        </div>
        <div>
          <label for="redacteur">Rédigé par</label>
          <input type="text" id="redacteur" placeholder="Ex : Mathieu Bonhomme">
        </div>
      </div>
    </section>

    <section class="section">
      <h2>Météo</h2>
      <div class="weather-btns" id="meteoBtns">
        <button type="button" class="weather-btn" data-val="Ensoleillé"><span class="emoji">☀️</span>Ensoleillé</button>
        <button type="button" class="weather-btn" data-val="Nuageux"><span class="emoji">⛅</span>Nuageux</button>
        <button type="button" class="weather-btn" data-val="Pluvieux"><span class="emoji">🌧️</span>Pluvieux</button>
        <button type="button" class="weather-btn" data-val="Orageux"><span class="emoji">⛈️</span>Orageux</button>
        <button type="button" class="weather-btn" data-val="Neigeux"><span class="emoji">❄️</span>Neige</button>
        <button type="button" class="weather-btn" data-val="Venteux"><span class="emoji">💨</span>Vent</button>
        <button type="button" class="weather-btn" data-val="Brouillard"><span class="emoji">🌫️</span>Brouillard</button>
        <button type="button" class="weather-btn" data-val="Forte chaleur"><span class="emoji">🔥</span>Canicule</button>
      </div>
    </section>

    <section class="section">
      <h2>Équipes & chantiers</h2>
      <div id="equipes"></div>
      <button type="button" class="btn-add" id="eq-add">+ Ajouter une équipe</button>
      <p class="hint">Un chapitre par équipe = front affecté + membres (heures) + matériel + tâches.</p>
    </section>

    <section class="section">
      <h2>Récap avancement global</h2>
      <div id="av-recap" class="recap-grid">
        <p class="hint">Ajoute des tâches dans les équipes pour voir le récap global.</p>
      </div>
    </section>

  </form>
</main>

<div class="actions">
  <button type="button" class="btn btn-secondary" id="btnReset" title="Réinitialiser">🗑️</button>
  <button type="button" class="btn btn-neutral" id="btnXlsx">Excel</button>
  <button type="button" class="btn btn-share" id="btnShare" title="Partager (SMS/WhatsApp/mail)">📤 Partager</button>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
